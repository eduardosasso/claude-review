name: Claude

on:
  workflow_call:
    inputs:
      runs_on:
        description: JSON array (or plain label) of runner labels for the job.
        required: false
        type: string
        default: '["self-hosted","omarchy"]'
    secrets:
      claude_code_oauth_token:
        required: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        # v1.0.218 ships a broken installer; see anthropics/claude-code-action#1817
        uses: anthropics/claude-code-action@ef7878a0506921197f7f9cd8a6c8dc7b11497021 # v1.0.217
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          additional_permissions: |
            actions: read
